<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 13</title>
</head>
<body>
    <script>
        const mostrarArreglo = (arreglo) => {
            for (let i = 0; i < arreglo.length ; i++){
                document.write(arreglo[i] + "<br>" );
            }
        };
        

        const cantidad = parseInt(prompt(`Cuantos numeros desea almacenar?`));
        let numeros = [];

        for (let i = 0; i < cantidad; i++){
            let ingreso = parseInt(prompt(`Ingrese el numero ${i+1} `));
            numeros.push(ingreso);
        }
        mostrarArreglo(numeros);
    </script>
</body>
</html>
