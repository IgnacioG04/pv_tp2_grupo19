<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio11</title>
</head>
<body>
    <script>
        const kilometros = parseInt(prompt(`Ingrese la cantidad de kilometros que recorrio con su vehiculo`));
        const litros = parseInt(prompt(`Ingrese el numero de litros de combustible consumidos`));
        const consumo = litros / kilometros; 
        document.write(`el consumo de combustible por kilometro fue de: ${consumo}`);

    </script>
</body>
</html>
