<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio21</title>
    <link rel="stylesheet" href="ejercicio21.css">
</head>
<body>

    <div class="container">
        <h2>Ubicaciones de América</h2>
        
        <label for="paises">Selecciona un País:</label>
        <select id="paises">
            <option value="">-- Elige un país --</option>
            <option value="Argentina">Argentina</option>
            <option value="Brasil">Brasil</option>
            <option value="Canadá">Canadá</option>
            <option value="Chile">Chile</option>
            <option value="Colombia">Colombia</option>
            <option value="México">México</option>
        </select>

        <label for="capitales">Capital Correspondiente:</label>
        <select id="capitales" disabled>
            <option value="">-- Capital --</option>
            <option value="Buenos Aires">Buenos Aires</option>
            <option value="Brasilia">Brasilia</option>
            <option value="Ottawa">Ottawa</option>
            <option value="Santiago">Santiago</option>
            <option value="Bogotá">Bogotá</option>
            <option value="Ciudad de México">Ciudad de México</option>
        </select>
    </div>

    <script src="ejercicio21.js"></script>
    
</body>
</html>
