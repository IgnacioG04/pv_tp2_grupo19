<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 15</title>
</head>
<body>
    <script>

        const retornarMes = (numero) => {
            const meses = [
                "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
                "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
            ];

            if (numero >= 1 && numero <= 12) {
                return meses[numero - 1];
            } else {
                return "el número ingresado no es un mes válido";
            }
        };

        const numIngresado = parseInt(prompt("Ingrese un número del 1 al 12:"));

        const resultado = retornarMes(numIngresado);

        document.write(`<p>Resultado: ${resultado}</p>`);
    </script>
</body>
</html>
