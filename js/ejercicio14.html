<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 14</title>
</head>
<body>
    <script>
        
        const duplicar = (arreglo) => {
            let resultado = [];
            for (let i = 0; i < arreglo.length; i++) {
                resultado[i] = arreglo[i] * 2;
            }
            return resultado;
        };

        const cant = parseInt(prompt("Ingrese cuántos números tendrá el array:"));
        let misNumeros = [];

        for (let i = 0; i < cant; i++) {
            misNumeros[i] = parseFloat(prompt(`Ingrese el valor ${i + 1}:`));
        }

        const duplicados = duplicar(misNumeros);
        document.write(`Los números duplicados son: ${duplicados}`);
    </script>
</body>
</html>
